name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python client (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run Python client checks
        env:
          PYTHONPATH: python/src
        run: python -m unittest discover -s tests/python -v

  core:
    name: .NET core protocol tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Test Unity-independent core
        run: dotnet test tests/ScreenStocksBridge.Core.Tests/ScreenStocksBridge.Core.Tests.csproj --configuration Release

  game-compatibility:
    name: Game compatibility and plugin build
    # Never run untrusted pull-request code on the self-hosted game runner.
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Windows, X64, screenstocks]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Check supported game API surface
        shell: powershell
        env:
          SCREENSTOCKS_GAME_DIR: ${{ vars.SCREENSTOCKS_GAME_DIR }}
        run: .\tools\check-game-compatibility.ps1
      - name: Build plugin against installed game
        shell: powershell
        env:
          SCREENSTOCKS_GAME_DIR: ${{ vars.SCREENSTOCKS_GAME_DIR }}
        run: |
          $gameDir = $env:SCREENSTOCKS_GAME_DIR
          if ([string]::IsNullOrWhiteSpace($gameDir)) {
            $gameDir = 'C:\Program Files (x86)\Steam\steamapps\common\Screen Stocks Demo'
          }
          dotnet build plugin/ScreenStocksBridge/ScreenStocksBridge.csproj -c Release "-p:GameDir=$gameDir"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
