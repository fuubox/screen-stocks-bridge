name: Publish Python package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag whose Python package should be published
        required: true
        default: v0.8.0
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish Python distributions
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/screenstocks-bridge/
    permissions:
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Bootstrap from the hash-pinned wheel because setup-python may provide
      # an older pip with the affected bundled CA certificates.
      - name: Bootstrap patched pip and certifi
        run: |
          python -m pip --disable-pip-version-check install --no-index --no-deps --upgrade "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          python -m pip --version
          python -m pip install --upgrade "pip>=26.2.2" "certifi>=2026.10.19"

      - name: Validate tag and package version
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)", tag):
              raise SystemExit(f"Invalid release tag: {tag!r}")
          with Path("python/pyproject.toml").open("rb") as metadata_file:
              version = tomllib.load(metadata_file)["project"]["version"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag!r} does not match Python package version {version!r}")
          PY

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade build
          python -m build --sdist --wheel python

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
